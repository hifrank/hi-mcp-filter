apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-proxy-config
  namespace: default
data:
  config.json: |
    {
      "server": {
        "port": 8080,
        "host": "0.0.0.0"
      },
      "logging": {
        "level": "info"
      },
      "mcpServers": [
        {
          "id": "primary-server",
          "url": "http://mcp-server.default.svc.cluster.local:5000",
          "timeout": 30000,
          "retryPolicy": {
            "maxRetries": 3,
            "backoffMs": 100
          }
        }
      ],
      "filters": [],
      "transformations": [],
      "plugins": {
        "enabled": true,
        "directory": "/app/plugins",
        "timeout": 5000
      }
    }
