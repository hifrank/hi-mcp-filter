version: '3.8'

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      LOG_LEVEL: debug
      CONFIG_FILE: /app/config/default.json
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxy-network

  # Optional: MCP server for testing
  mcp-server:
    image: node:20-alpine
    working_dir: /app
    command: node mcp-server.js
    ports:
      - "5000:5000"
    volumes:
      - ./examples/mcp-server.js:/app/mcp-server.js
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
